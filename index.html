<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% 은 Vite 가 빌드 때 base 경로로 치환한다.
         './' 로 두면 주소 끝에 슬래시가 없을 때 루트로 잘못 풀려 404 가 난다. -->
    <link rel="icon" type="image/png" sizes="74x74" href="%BASE_URL%genzlab-logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%genzlab-logo.png" />
    <meta name="apple-mobile-web-app-title" content="Gen Z Lab." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#6A2FF0" />
    <!-- 라이트 전용 선언.
         Chrome·삼성 인터넷의 "다크 모드 강제 적용"이 켜져 있으면 브라우저가
         페이지 색을 임의로 반전시킨다. 보라 배경이 탁해지고 흰 카드가 회색이 되며,
         게임 2 의 의도적인 검은 배경(ink)은 흰색으로 뒤집힌다.
         `only light` 는 `light` 보다 강한 선언 — UA 의 강제 다크(Chromium
         Auto Dark Theme)까지 opt-out 시킨다. index.css 의 :root 와 짝이다. -->
    <meta name="color-scheme" content="only light" />
    <title>Gen Z Lab. 2026년 3분기 워크샵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
